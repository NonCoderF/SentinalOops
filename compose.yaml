services:
  test-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelops/test-service:phase-1
    environment:
      PORT: "${PORT:-8080}"
      HOST: "${HOST:-0.0.0.0}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    depends_on:
      test-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env or the shell environment}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "2s"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  alert-manager:
    build:
      context: .
      dockerfile: Dockerfile.alert-manager
    image: sentinelops/alert-manager:phase-3
    environment:
      PORT: "8081"
      HOST: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DATABASE_PATH: "/var/lib/sentinelops/sentinelops.db"
      AUTH_ENABLED: "${SENTINELOPS_AUTH_ENABLED:-false}"
      ADMIN_TOKEN: "${SENTINELOPS_ADMIN_TOKEN:-local-development-token}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:-local-development-encryption-key}"
      ALERTMANAGER_WEBHOOK_TOKEN: "${ALERTMANAGER_WEBHOOK_TOKEN:-}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_RECIPIENTS: "${SMTP_RECIPIENTS:-}"
      DASHBOARD_URL: "${SENTINELOPS_DASHBOARD_URL:-http://localhost:3005}"
      PROMETHEUS_URL: "http://prometheus:9090"
      RECOVERY_CONTROLLER_URL: "http://recovery-controller:8090"
      RECOVERY_CONTROLLER_TOKEN: "${RECOVERY_CONTROLLER_TOKEN:-local-recovery-controller-token}"
      TEST_SERVICE_URL: "http://test-service:8080"
    volumes:
      - sentinelops_data:/var/lib/sentinelops
    ports:
      - "127.0.0.1:3005:8081"
    restart: unless-stopped
    init: true
    depends_on:
      prometheus:
        condition: service_healthy
      recovery-controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  recovery-controller:
    build:
      context: .
      dockerfile: Dockerfile.recovery-controller
    image: sentinelops/recovery-controller:phase-1
    environment:
      PORT: "8090"
      RECOVERY_CONTROLLER_TOKEN: "${RECOVERY_CONTROLLER_TOKEN:-local-recovery-controller-token}"
      ALLOWED_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME:-sentinelops}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    init: true
    networks:
      - default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  prometheus_data:
    name: sentinelops_prometheus_data
  grafana_data:
    name: sentinelops_grafana_data
  sentinelops_data:
    name: sentinelops_data
