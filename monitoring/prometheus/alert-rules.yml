groups:
  - name: sentinelops-service-alerts
    interval: 2s
    rules:
      - alert: ServiceDown
        expr: up{job="sentinelops-test-service"} == 0
        for: 10s
        labels:
          severity: critical
          service: test-service
        annotations:
          summary: Test service is unavailable
          description: Test service is unavailable.

      # process CPU seconds are cumulative CPU time. This expression is a
      # fraction of one CPU; 0.40 is 80% of the service's 0.50 CPU limit.
      - alert: HighCPUUsage
        expr: (rate(sentinelops_process_cpu_user_seconds_total{job="sentinelops-test-service"}[30s]) + rate(sentinelops_process_cpu_system_seconds_total{job="sentinelops-test-service"}[30s])) > 0.40
        for: 20s
        labels:
          severity: warning
          service: test-service
        annotations:
          summary: Test service CPU usage is high
          description: Test service CPU utilization is above 80% of its configured 0.50 CPU limit.

      # RSS is an absolute byte value, not a percentage. 200 MiB leaves
      # approximately 56 MiB below the Compose memory limit of 256 MiB.
      - alert: HighMemoryUsage
        expr: sentinelops_process_resident_memory_bytes{job="sentinelops-test-service"} > 209715200
        for: 20s
        labels:
          severity: warning
          service: test-service
        annotations:
          summary: Test service memory usage is high
          description: Test service resident memory is above 200 MiB of the configured 256 MiB container limit.

      - alert: HighHTTPErrorRate
        expr: (sum(rate(sentinelops_http_requests_total{job="sentinelops-test-service",status_code=~"5.."}[30s])) > 0.1) and (sum(rate(sentinelops_http_requests_total{job="sentinelops-test-service"}[30s])) > 0)
        for: 20s
        labels:
          severity: warning
          service: test-service
        annotations:
          summary: Test service HTTP 5xx rate is high
          description: Test service is returning more than 0.1 HTTP 5xx responses per second over the last 30 seconds.
