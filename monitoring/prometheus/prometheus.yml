global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: sentinelops-test-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - test-service:8080

  # The load-testing CLI is launched on the host, not as a Compose service.
  # It is intentionally absent until the CLI is running.
  - job_name: sentinelops-load-test
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9464
