services:
  kubernetes-terminal:
    build:
      context: ../sentinelops/kubernetes-terminal
      dockerfile: Dockerfile
    image: sentinelops/kubernetes-terminal:local
    environment:
      TERMINAL_TOKEN: ${KUBERNETES_TERMINAL_TOKEN:-local-terminal-token}
      TERMINAL_MAX_SESSIONS: ${KUBERNETES_TERMINAL_MAX_SESSIONS:-4}
      TERMINAL_TEST_SERVICE_PROXY: ${TERMINAL_TEST_SERVICE_PROXY:-true}
      # The trusted local terminal is also the host-side kind/kubectl bridge.
      # Keep this capability in the Compose service so a restart does not lose
      # Docker access or kind API hostname resolution.
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - kubernetes_terminal_workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    # 127.0.0.1 inside this container is the container itself. Use the
    # Docker Desktop host gateway for services published on Windows.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [sentinelops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3

  sentinelops:
    build:
      context: ..
      dockerfile: sentinelops/Dockerfile
    image: ${SENTINELOPS_IMAGE}
    environment:
      NODE_ENV: production
      PORT: "8081"
      HOST: 0.0.0.0
      DATABASE_PATH: /var/lib/sentinelops/sentinelops.db
      AUTH_ENABLED: ${SENTINELOPS_AUTH_ENABLED:-true}
      ADMIN_TOKEN: ${SENTINELOPS_ADMIN_TOKEN}
      SETUP_TOKEN: ${SENTINELOPS_SETUP_TOKEN}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      BLACKBOX_EXPORTER_URL: http://blackbox-exporter:9115
      PROMETHEUS_FILE_SD_PATH: /etc/prometheus/file_sd/endpoints.json
      PROMETHEUS_METRICS_FILE_SD_PATH: /etc/prometheus/file_sd/metrics.json
      PROMETHEUS_METRICS_TARGET: ${PROMETHEUS_METRICS_TARGET:-}
      PROMETHEUS_METRICS_APPLICATION: ${PROMETHEUS_METRICS_APPLICATION:-}
      RECOVERY_CONTROLLER_URL: http://recovery-controller:8090
      RECOVERY_CONTROLLER_TOKEN: ${RECOVERY_CONTROLLER_TOKEN:-local-recovery-controller-token}
      RECOVERY_ALLOWED_SERVICE: ${RECOVERY_ALLOWED_SERVICE:-test-service}
      RECOVERY_HEALTH_URL: ${RECOVERY_HEALTH_URL:-http://host.docker.internal:8080/api/health}
      RECOVERY_ALLOWED_IMAGE: ${RECOVERY_ALLOWED_IMAGE:-sentinelops/test-service:local}
      KUBERNETES_AGENT_PROBE_HOST: ${KUBERNETES_AGENT_PROBE_HOST:-host.docker.internal}
      DASHBOARD_URL: http://localhost:${SENTINELOPS_WEB_PORT:-3005}
      KUBERNETES_TERMINAL_URL: ws://kubernetes-terminal:8787/terminal
      KUBERNETES_TERMINAL_TOKEN: ${KUBERNETES_TERMINAL_TOKEN:-local-terminal-token}
    volumes:
      - sentinelops_data:/var/lib/sentinelops
      - prometheus_file_sd:/etc/prometheus/file_sd
    ports:
      - "127.0.0.1:${SENTINELOPS_WEB_PORT:-3005}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [sentinelops]
    depends_on:
      kubernetes-terminal: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle", "--web.enable-admin-api"]
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_file_sd:/etc/prometheus/file_sd
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [sentinelops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE}
    command: ["--config.file=/etc/blackbox_exporter/blackbox.yml"]
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [sentinelops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9115/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5

  recovery-controller:
    build:
      context: ..
      dockerfile: sentinelops/recovery-controller/Dockerfile
    image: sentinelops/recovery-controller:phase-1
    environment:
      PORT: "8090"
      RECOVERY_CONTROLLER_TOKEN: ${RECOVERY_CONTROLLER_TOKEN:-local-recovery-controller-token}
      ALLOWED_COMPOSE_PROJECT: ${RECOVERY_COMPOSE_PROJECT:-sentinelops-test-service}
      ALLOWED_RECOVERY_SERVICES: ${RECOVERY_ALLOWED_SERVICES:-test-service,test-service-2}
      ALLOWED_RECOVERY_SERVICE: ${RECOVERY_ALLOWED_SERVICE:-test-service}
      ALLOWED_RECOVERY_IMAGE: ${RECOVERY_ALLOWED_IMAGE:-sentinelops/test-service:local}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [sentinelops]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3

  grafana:
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [sentinelops]
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  sentinelops_data: { name: sentinelops_install_data }
  kubernetes_terminal_workspace: { name: sentinelops_install_kubernetes_terminal_workspace }
  prometheus_data: { name: sentinelops_install_prometheus }
  grafana_data: { name: sentinelops_install_grafana }
  prometheus_file_sd: { name: sentinelops_install_file_sd }

networks:
  sentinelops:
    name: sentinelops_install_network
