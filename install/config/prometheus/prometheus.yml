global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: sentinelops-api-probes
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/file_sd/endpoints.json]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: sentinelops-prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: sentinelops-load-test
    static_configs:
      - targets: [host.docker.internal:9464]
  - job_name: sentinelops-application-metrics
    scrape_interval: 2s
    scrape_timeout: 1s
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/file_sd/metrics.json]
        refresh_interval: 2s
