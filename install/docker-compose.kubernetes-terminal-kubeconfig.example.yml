services:
  kubernetes-terminal:
    environment:
      KUBECONFIG: /home/terminal/.kube/config
    volumes:
      - ${KUBECONFIG_PATH:?Set KUBECONFIG_PATH to a dedicated kubeconfig file}:/home/terminal/.kube/config:ro
    networks:
      - sentinelops
      - kind

networks:
  kind:
    external: true
    name: kind
